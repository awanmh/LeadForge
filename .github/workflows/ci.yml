name: LeadForge CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-secrets:
    name: Secrets & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no committed secrets or .env files
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file must never be committed!"
            exit 1
          fi
          echo "Secret check passed."

  api-tests:
    name: FastAPI Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: leadforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies & run pytest
        working-directory: ./api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test_password@localhost:5432/leadforge_test
          APP_ENV: test
          LOG_LEVEL: info
        run: |
          uv pip install --system -r pyproject.toml
          pytest -v

  frontend-build:
    name: Astro Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Check types & build static site
        working-directory: ./frontend
        env:
          PUBLIC_SITE_URL: https://demo.leadforge.local
        run: npm run build
