events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $request_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_id';

    access_log /var/log/nginx/access.log sanitized;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting zone for lead intake (10 requests per minute per IP)
    limit_req_zone $binary_remote_addr zone=leads_rate_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream fastapi_upstream {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # Static Astro frontend assets
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /404.html =404;
        }

        # Same-origin lead intake endpoint
        location /api/v1/leads {
            limit_req zone=leads_rate_limit burst=3 nodelay;

            proxy_pass http://fastapi_upstream/api/v1/leads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Health check proxy
        location /health/ {
            proxy_pass http://fastapi_upstream/health/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
