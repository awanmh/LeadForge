services:
  db:
    image: postgres:16-alpine
    container_name: leadforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_password_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leadforge_internal

  cms:
    build:
      context: ../cms
      dockerfile: Dockerfile
    container_name: leadforge-strapi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${CMS_DB_NAME:-leadforge_cms}
      DATABASE_USERNAME: ${CMS_DB_USER:-leadforge_cms_user}
      DATABASE_PASSWORD: ${CMS_DB_PASSWORD:-cms_secure_pass_dev_only}
      APP_KEYS: ${APP_KEYS:-devKey1,devKey2,devKey3,devKey4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-dev_api_token_salt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev_admin_jwt_secret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-dev_transfer_salt}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret}
    volumes:
      - ../cms/public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - leadforge_internal

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: leadforge-fastapi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-leadforge_app_user}:${APP_DB_PASSWORD:-app_secure_pass_dev_only}@db:5432/${APP_DB_NAME:-leadforge_app}
      MAX_REQUEST_BYTES: 1048576
      RATE_LIMIT_PER_MINUTE: 10
      TRUSTED_PROXIES: 127.0.0.1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - leadforge_internal

  proxy:
    image: nginx:1.27-alpine
    container_name: leadforge-proxy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - leadforge_internal

networks:
  leadforge_internal:
    driver: bridge

volumes:
  postgres_data:
